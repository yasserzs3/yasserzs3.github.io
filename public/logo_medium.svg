<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="128" height="128">
  <defs>
    <linearGradient id="crest-gradient-medium" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>
  </defs>

  <style>
    @keyframes drawInMedium {
      from { stroke-dashoffset: 800; }
      to { stroke-dashoffset: 0; }
    }
    .crest-outline {
      stroke: url(#crest-gradient-medium);
      stroke-width: 1.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: drawInMedium 2.2s ease-out forwards;
      transition: stroke-width 0.3s ease, filter 0.3s ease;
    }
    .drift-path {
      stroke: url(#crest-gradient-medium);
      stroke-width: 3.2px;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), filter 0.3s ease;
    }
    .drift-path-1 { animation: drawInMedium 2s ease forwards 0.1s; }
    .drift-path-2 { animation: drawInMedium 1.8s ease forwards 0.2s; }
    .drift-path-3 { animation: drawInMedium 1.6s ease forwards 0.3s; }
    .drift-path-4 { animation: drawInMedium 1.4s ease forwards 0.4s; }
    
    .blueprint-grid { stroke: #6E6D99; stroke-width: 0.5px; opacity: 0.12; }
    .blueprint-circle { stroke: #6E6D99; stroke-width: 0.5px; opacity: 0.18; stroke-dasharray: 1 3; }
    .blueprint-axis { stroke: #6E6D99; stroke-width: 0.5px; opacity: 0.2; stroke-dasharray: 2 4; }
    .blueprint-tick { stroke: #6E6D99; stroke-width: 0.5px; opacity: 0.35; }
    .blueprint-text { fill: #6E6D99; font-family: 'Space Grotesk', monospace; font-size: 5px; opacity: 0.45; }

    svg:hover .crest-outline { stroke-width: 2px; }
    svg:hover .drift-path { stroke-width: 3.8px; }
    svg:hover .drift-path-1 { transform: translate(-3px, -2px); }
    svg:hover .drift-path-3 { transform: translate(2px, 2px); }
    svg:hover .drift-path-4 { transform: translate(3px, 4px); }
  </style>

  <!-- Background technical blueprint -->
  <line x1="30" y1="10" x2="30" y2="190" class="blueprint-grid" />
  <line x1="90" y1="10" x2="90" y2="190" class="blueprint-grid" />
  <line x1="150" y1="10" x2="150" y2="190" class="blueprint-grid" />
  <line x1="10" y1="30" x2="190" y2="30" class="blueprint-grid" />
  <line x1="10" y1="90" x2="190" y2="90" class="blueprint-grid" />
  <line x1="10" y1="150" x2="190" y2="150" class="blueprint-grid" />

  <circle cx="30" cy="170" r="100" class="blueprint-circle" />
  <circle cx="30" cy="170" r="140" class="blueprint-circle" />

  <line x1="10" y1="170" x2="190" y2="170" class="blueprint-axis" />
  <line x1="30" y1="10" x2="30" y2="190" class="blueprint-axis" />

  <text x="35" y="25" class="blueprint-text">θ = 38.65°</text>
  <text x="95" y="165" class="blueprint-text">APEX_R = 120.5mm</text>

  <!-- Outer Asymmetric Crest -->
  <path d="M 30,170 C 45,120 90,55 170,30 C 172,30 172,32 170,35 C 150,65 140,90 148,105 C 149,107 146,110 142,109 C 135,107 132,112 135,118 C 142,122 153,124 158,118 C 125,150 80,172 30,170 Z" 
        class="crest-outline" />

  <!-- Dynamic Fanning paths -->
  <path d="M 32,168 C 50,123 92,63 166,34" class="drift-path drift-path-1" />
  <path d="M 35,166 C 60,128 100,75 158,45" class="drift-path drift-path-2" />
  <path d="M 38,164 C 70,133 110,90 146,65" class="drift-path drift-path-3" />
  <path d="M 42,162 C 80,140 115,115 136,90" class="drift-path drift-path-4" />
</svg>
